name: 2 - Test
run-name: Test (${{ inputs.environment }}, greeting=${{ inputs.greeting_name }}, color=${{ inputs.bg_color }})

# Tests the build of build_run_id (or builds it here when not given), checked out at source_sha.
on:
  workflow_dispatch:
    inputs:
      greeting_name:
        description: Name shown in the greeting
        type: string
        default: GitHub Pages
      environment:
        description: Target environment label
        type: choice
        options: [dev, staging, prod]
        default: dev
      show_build_info:
        description: Show build info panel on the site
        type: boolean
        default: true
      bg_color:
        description: Webpage background color
        type: choice
        options: [white, black, green, red]
        default: white
      source_sha:
        description: Commit to build (empty = the ref's head). Set by a deployment pipeline to pin every stage to one commit.
        type: string
        required: false
        default: ''
      build_label:
        description: Label of the build under test (output of 1 - Build)
        type: string
        required: false
        default: ''
      build_run_id:
        description: Run ID of a "1 - Build" run whose build-output artifact to use instead of rebuilding (empty = build here).
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read   # download the build artifact from another run

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GREETING_NAME: ${{ inputs.greeting_name }}
      APP_ENV: ${{ inputs.environment }}
      SHOW_BUILD_INFO: ${{ inputs.show_build_info && 'true' || 'false' }}
      BG_COLOR: ${{ inputs.bg_color }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the build artifact from run ${{ inputs.build_run_id }}
        if: inputs.build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Build (no build run given)
        if: inputs.build_run_id == ''
        run: npm run build
      - name: Show inputs in run summary
        run: |
          {
            echo "### Test inputs"
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| greeting_name | $GREETING_NAME |"
            echo "| environment | $APP_ENV |"
            echo "| show_build_info | $SHOW_BUILD_INFO |"
            echo "| bg_color | $BG_COLOR |"
            echo "| commit | ${SOURCE_SHA:-$GITHUB_SHA} |"
            echo "| build_label | ${{ inputs.build_label || '-' }} |"
            echo "| build artifact | ${{ inputs.build_run_id && format('run {0}', inputs.build_run_id) || 'built in this run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests against build output
        shell: bash   # enables pipefail so a failing `npm test` fails the job despite `tee`
        run: |
          mkdir -p test-report
          npm test | tee test-report/results.txt
      - name: Verify build matches inputs
        run: |
          node -e '
            const info = require("./dist/build-info.json");
            const expected = {
              greetingName: process.env.GREETING_NAME,
              environment: process.env.APP_ENV,
              showBuildInfo: process.env.SHOW_BUILD_INFO === "true",
              backgroundColor: process.env.BG_COLOR,
              commit: process.env.SOURCE_SHA,
            };
            for (const [k, v] of Object.entries(expected)) {
              if (info[k] !== v) { console.error(`${k}: expected ${v}, got ${info[k]}`); process.exit(1); }
            }
            console.log("build-info.json matches inputs", expected);
          '
      - name: Publish pipeline outputs
        run: |
          mkdir -p pipeline
          PASSED=$(grep -oE '^ℹ pass [0-9]+' test-report/results.txt | grep -oE '[0-9]+' || echo 0)
          echo "{\"tests_passed\": $PASSED}" > pipeline/outputs.json
          cat pipeline/outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: pipeline/outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: |
            dist/
            test-report/
