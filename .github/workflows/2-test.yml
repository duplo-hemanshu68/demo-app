name: 2 - Test

on:
  workflow_run:
    workflows: ["1 - Build"]
    types: [completed]

permissions:
  contents: read
  actions: read   # needed to download artifacts from the Build run

jobs:
  test:
    # Only run if the build succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # INPUT <- artifact produced by workflow 1
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests against build output
        run: |
          mkdir -p test-report
          npm test | tee test-report/results.txt
      # OUTPUT -> consumed by workflow 3 (verified build + report)
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: |
            dist/
            test-report/
