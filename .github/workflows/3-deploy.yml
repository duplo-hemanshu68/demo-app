name: 3 - Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["2 - Test"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # INPUT <- artifact produced by workflow 2
      - uses: actions/download-artifact@v4
        with:
          name: tested-build
          path: input/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble site
        run: |
          mkdir site
          cp -r input/dist/. site/
          cp -r input/test-report site/test-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
