name: GKE Setup
run-name: GKE Setup

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
      - name: check componets
        run: |
          echo "Checking components..."
          gcloud components list
          kubectl --version
      
      