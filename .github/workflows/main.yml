name: Main Workflow
run-name: Main (${{ inputs.environment }}, greeting=${{ inputs.greeting_name }}, color=${{ inputs.bg_color }})

# Runs build, test and deploy as three independent jobs in a single workflow.
# The jobs have no `needs` between them, so they run in parallel and each one
# checks out and builds the app itself instead of consuming another job's artifact.
on:
  workflow_dispatch:
    inputs:
      greeting_name:
        description: Name shown in the greeting
        type: string
        default: GitHub Pages
      environment:
        description: Target environment label
        type: choice
        options: [dev, staging, prod]
        default: dev
      show_build_info:
        description: Show build info panel on the site
        type: boolean
        default: true
      bg_color:
        description: Webpage background color
        type: choice
        options: [white, black, green, red]
        default: white

permissions:
  contents: read

# Workflow-level env: the dispatch inputs are available to every job (build, test, deploy).
env:
  GREETING_NAME: ${{ inputs.greeting_name }}
  APP_ENV: ${{ inputs.environment }}
  SHOW_BUILD_INFO: ${{ inputs.show_build_info && 'true' || 'false' }}
  BG_COLOR: ${{ inputs.bg_color }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show inputs in run summary
        run: |
          {
            echo "### Main Workflow inputs"
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| greeting_name | $GREETING_NAME |"
            echo "| environment | $APP_ENV |"
            echo "| show_build_info | $SHOW_BUILD_INFO |"
            echo "| bg_color | $BG_COLOR |"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Run tests against build output
        shell: bash   # enables pipefail so a failing `npm test` fails the job despite `tee`
        run: |
          mkdir -p test-report
          npm test | tee test-report/results.txt
      - name: Verify build matches inputs
        run: |
          node -e '
            const info = require("./dist/build-info.json");
            const expected = {
              greetingName: process.env.GREETING_NAME,
              environment: process.env.APP_ENV,
              showBuildInfo: process.env.SHOW_BUILD_INFO === "true",
              backgroundColor: process.env.BG_COLOR,
            };
            for (const [k, v] of Object.entries(expected)) {
              if (info[k] !== v) { console.error(`${k}: expected ${v}, got ${info[k]}`); process.exit(1); }
            }
            console.log("build-info.json matches inputs", expected);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: |
            dist/
            test-report/

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Show inputs in run summary
        run: |
          {
            echo "### Deploying with inputs"
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| greeting_name | $GREETING_NAME |"
            echo "| environment | $APP_ENV |"
            echo "| show_build_info | $SHOW_BUILD_INFO |"
            echo "| bg_color | $BG_COLOR |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      # The site links to test-report/results.txt, so generate it here too
      - name: Generate test report
        shell: bash
        run: |
          mkdir -p test-report
          npm test | tee test-report/results.txt
      - name: Assemble site
        run: |
          mkdir site
          cp -r dist/. site/
          cp -r test-report site/test-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
