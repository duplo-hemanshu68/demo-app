name: 1 - Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      # OUTPUT -> consumed by workflow 2
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
