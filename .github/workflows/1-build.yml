name: 1 - Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      greeting_name:
        description: Name shown in the greeting
        type: string
        default: GitHub Pages
      environment:
        description: Target environment label
        type: choice
        options: [dev, staging, prod]
        default: dev
      show_build_info:
        description: Show build info panel on the site
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # On push there are no inputs, so fall back to defaults
    env:
      GREETING_NAME: ${{ inputs.greeting_name || 'GitHub Pages' }}
      APP_ENV: ${{ inputs.environment || 'dev' }}
      SHOW_BUILD_INFO: ${{ inputs.show_build_info == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      # OUTPUT -> consumed by workflow 2
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
