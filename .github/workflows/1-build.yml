name: 1 - Build
run-name: Build (${{ inputs.environment || 'dev' }}, greeting=${{ inputs.greeting_name || 'GitHub Pages' }}, color=${{ inputs.bg_color || 'white' }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      greeting_name:
        description: Name shown in the greeting
        type: string
        default: GitHub Pages
      environment:
        description: Target environment label
        type: choice
        options: [dev, staging, prod]
        default: dev
      show_build_info:
        description: Show build info panel on the site
        type: boolean
        default: true
      bg_color:
        description: Webpage background color
        type: choice
        options: [white, black, green, red]
        default: white
      source_sha:
        description: Commit to build (empty = the ref's head). Set by a deployment pipeline to pin every stage to one commit.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # On push there are no inputs, so fall back to defaults
    env:
      GREETING_NAME: ${{ inputs.greeting_name || 'GitHub Pages' }}
      APP_ENV: ${{ inputs.environment || 'dev' }}
      SHOW_BUILD_INFO: ${{ inputs.show_build_info == false && 'false' || 'true' }}
      BG_COLOR: ${{ inputs.bg_color || 'white' }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show inputs in run summary
        run: |
          {
            echo "### Build inputs"
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| greeting_name | $GREETING_NAME |"
            echo "| environment | $APP_ENV |"
            echo "| show_build_info | $SHOW_BUILD_INFO |"
            echo "| bg_color | $BG_COLOR |"
            echo "| commit | ${SOURCE_SHA:-$GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # OUTPUT -> used by 2 - Test and 3 - Deploy when they get this run's ID as build_run_id
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
